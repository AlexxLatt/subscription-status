databaseChangeLog:
  - changeSet:
      id: 001-create-subscriptions-table
      author: developer

      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subscriptions
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false